<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Бағалау парағы</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#f2f2f2;
}

.container{
    width:420px;
    margin:20px auto;
}

h1{
    font-size:34px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.switch{
    display:flex;
    align-items:center;
    gap:10px;
}

.toggle{
    width:50px;
    height:25px;
    background:#4a90e2;
    border-radius:20px;
    position:relative;
    cursor:pointer;
}

.toggle.off{
    background:#ccc;
}

.toggle::after{
    content:"";
    width:20px;
    height:20px;
    background:white;
    position:absolute;
    top:2.5px;
    right:3px;
    border-radius:50%;
    transition:0.3s;
}

.toggle.off::after{
    right:27px;
}

.input-box{
    display:flex;
    margin-top:20px;
}

input{
    flex:1;
    padding:15px;
    border-radius:12px;
    border:none;
    font-size:16px;
    background:#e9e9e9;
}

.add-btn{
    margin-left:10px;
    padding:15px 20px;
    background:#4a90e2;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.header{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    color:#777;
    font-weight:bold;
}

.student{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
}

.student.green{ background:#d9ebe3; }
.student.red{ background:#edd6d6; }

.actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.circle{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
}

.minus{ color:red; }
.plus{ color:green; }

.score{
    font-size:22px;
    width:30px;
    text-align:center;
}

.delete{
    cursor:pointer;
    font-size:20px;
}
</style>

</head>
<body>

<div class="container">

<div class="top">
    <h1>📋 Бағалау парағы</h1>
    <div class="switch">
        <span>Дыбыс</span>
        <div class="toggle" id="soundToggle"></div>
    </div>
</div>

<div class="input-box">
    <input type="text" id="name" placeholder="Оқушының есімі...">
    <button class="add-btn" onclick="addStudent()">Қосу</button>
</div>

<div class="header">
    <span>Оқушы</span>
    <span>Балл (0-10)</span>
    <span>Әрекет</span>
</div>

<div id="list"></div>

</div>

<script>
let sound = true;

const toggle = document.getElementById("soundToggle");
toggle.onclick = () => {
    sound = !sound;
    toggle.classList.toggle("off");
};

function playSound(){
    if(!sound) return;
    let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");
    audio.play();
}

let students = JSON.parse(localStorage.getItem("students")) || [];

function save(){
    localStorage.setItem("students", JSON.stringify(students));
}

function render(){
    let list = document.getElementById("list");
    list.innerHTML = "";

    students.forEach((st, index)=>{
        let div = document.createElement("div");
        div.className = "student " + (index%2==0 ? "green" : "red");

        div.innerHTML = `
            <span>${st.name}</span>
            <div class="actions">
                <div class="circle minus" onclick="changeScore(${index},-1)">−</div>
                <div class="score">${st.score}</div>
                <div class="circle plus" onclick="changeScore(${index},1)">+</div>
            </div>
            <div class="delete" onclick="removeStudent(${index})">🗑️</div>
        `;

        list.appendChild(div);
    });
}

function addStudent(){
    let name = document.getElementById("name").value;
    if(name==="") return alert("Атын жаз!");

    students.push({name:name, score:0});
    document.getElementById("name").value="";

    playSound();
    save();
    render();
}

function changeScore(index, val){
    students[index].score += val;

    if(students[index].score < 0) students[index].score = 0;
    if(students[index].score > 10) students[index].score = 10;

    playSound();
    save();
    render();
}

function removeStudent(index){
    students.splice(index,1);
    playSound();
    save();
    render();
}

render();
</script>

</body>
</html>
